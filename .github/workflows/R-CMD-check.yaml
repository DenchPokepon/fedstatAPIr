# CRAN-style checks on the latest R release: Linux and Windows.
name: R-CMD-check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (R release)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # LaTeX for the PDF manual and HTML Tidy for the HTML one, as on CRAN.
      - uses: r-lib/actions/setup-tinytex@v2

      - if: runner.os == 'Linux'
        run: sudo apt-get install -y tidy

      - if: runner.os == 'Windows'
        run: choco install html-tidy -y --no-progress

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          error-on: '"warning"'
          upload-snapshots: false
