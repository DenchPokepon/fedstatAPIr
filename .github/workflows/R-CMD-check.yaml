# CRAN-style checks on the latest R release: Linux and Windows.
name: R-CMD-check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R release)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config:
          # The PDF manual is the same on every system; it is built on Linux.
          # TinyTeX on the Windows runner hangs installing makeindex.
          - {os: ubuntu-latest, args: 'c("--as-cran")'}
          - {os: windows-latest, args: 'c("--as-cran", "--no-manual")'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # LaTeX for the PDF manual and HTML Tidy for the HTML one, as on CRAN.
      - if: runner.os == 'Linux'
        uses: r-lib/actions/setup-tinytex@v2

      - if: runner.os == 'Linux'
        run: sudo apt-get install -y tidy

      - if: runner.os == 'Windows'
        run: choco install html-tidy -y --no-progress

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.args }}
          error-on: '"warning"'
          upload-snapshots: false
